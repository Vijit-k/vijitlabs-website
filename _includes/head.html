<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --sub: #475569;
  --accent1: #dc2626;
  --accent2: #b91c1c;
  --blue: #1e40af;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* NAV */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px; border-bottom: 1px solid #1e293b;
  position: sticky; top: 0; z-index: 100;
  background: #0f172a;
}
.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo img { width: 44px; height: 44px; object-fit: contain; }
.nav-links { display: flex; align-items: center; gap: 32px; }
.nav-links a { font-size: 14px; color: #94a3b8; text-decoration: none; transition: color 0.15s; }
.nav-links a:hover, .nav-links a.active { color: #f1f5f9; }
.nav-cta {
  font-size: 13px; font-weight: 600; padding: 8px 18px;
  background: #1e40af; color: #fff; border-radius: 8px;
  text-decoration: none; transition: opacity 0.15s;
}
.nav-cta:hover { opacity: 0.88; }

/* FOOTER */
footer {
  padding: 32px 48px; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
}
.footer-logo img { width: 32px; height: 32px; object-fit: contain; opacity: 0.6; }
.footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
.footer-links a { font-size: 13px; color: var(--muted); text-decoration: none; }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  nav { padding: 16px 24px; }
  .nav-links { display: none; }
  footer { flex-direction: column; align-items: flex-start; padding: 28px 24px; }
}
</style>
